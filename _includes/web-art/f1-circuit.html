{%- comment -%} F1 Circuit 카드 일러스트 — 레드 스피드 스트라이프 + 그랑프리 트랙을 도는 차량. uid로 id 충돌을 피하고, fit="meet"이면 넓은 배너에서도 전체가 보이도록 배경이 좌우로 이어진다. {%- endcomment -%}
{%- assign u = include.uid | default: "f1" -%}
<svg class="wp-art" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid {{ include.fit | default: 'slice' }}" aria-hidden="true">
  <defs>
    <radialGradient id="{{ u }}-glow" cx="70%" cy="60%" r="70%">
      <stop offset="0" stop-color="#ff2a20" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff2a20" stop-opacity="0"/>
    </radialGradient>
    <pattern id="{{ u }}-check" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#1a1c22"/>
      <rect width="6" height="6" fill="#f5f5f7"/>
      <rect x="6" y="6" width="6" height="6" fill="#f5f5f7"/>
    </pattern>
    <path id="{{ u }}-track" d="M120,190 L320,190 C365,190 372,145 340,128 L300,108 C282,99 286,80 306,76 L340,68 C364,62 360,32 332,32 L160,32 C122,32 108,62 132,82 L160,104 C176,118 168,138 146,138 L112,138 C82,138 76,172 92,184 C100,190 108,190 120,190 Z"/>
  </defs>
  <rect x="-600" width="1600" height="240" fill="#14161c"/>
  <rect x="-600" width="1600" height="240" fill="url(#{{ u }}-glow)"/>
  <g opacity="0.95">
    <polygon points="26,22 92,22 86,36 20,36" fill="#ff2a20"/>
    <polygon points="26,42 72,42 66,56 20,56" fill="#ed0c04"/>
    <polygon points="26,62 52,62 46,76 20,76" fill="#c70600"/>
  </g>
  <use href="#{{ u }}-track" fill="none" stroke="#f5f5f7" stroke-width="20" stroke-linejoin="round"/>
  <use href="#{{ u }}-track" fill="none" stroke="#ff2a20" stroke-width="20" stroke-linejoin="round" stroke-dasharray="7 7"/>
  <use href="#{{ u }}-track" fill="none" stroke="#2a2d36" stroke-width="15" stroke-linejoin="round"/>
  <use href="#{{ u }}-track" fill="none" stroke="rgba(245,245,247,0.35)" stroke-width="1" stroke-dasharray="6 8"/>
  <rect x="214" y="183" width="10" height="15" fill="url(#{{ u }}-check)"/>
  <g class="wp-art__mover">
    <circle r="9" fill="#ff2a20" opacity="0.25"/>
    <circle r="4.5" fill="#ff2a20" stroke="#fff" stroke-width="1.5"/>
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#{{ u }}-track"/></animateMotion>
  </g>
  <rect x="-600" y="222" width="1600" height="18" fill="url(#{{ u }}-check)" opacity="0.9"/>
</svg>
