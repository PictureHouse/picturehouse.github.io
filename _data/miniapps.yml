- letter: b
  name: My Blocker
  tagline: 정해둔 사이트와 앱을 차단해 집중을 돕는 스크린 타임 앱
  platforms: [iOS, iPadOS]
  icon: /assets/icons/mini/b.png
  privacy: myblocker
  terms: myblocker
  description: |
    ## 소개

    My Blocker는 스스로 정한 웹사이트와 앱을 정해진 기간 동안 차단해 집중을 돕는 앱입니다.
    차단 기간 동안에는 앱 안에서도 항목을 지울 수 없어, 충동적으로 차단을 풀지 않도록 막아줍니다.

    ## 주요 기능

    - **사이트 · 앱 차단** — 고른 웹사이트와 앱(또는 앱 카테고리)을 정한 기간 동안, 또는 영구적으로 차단
    - **집중모드** — 차단할 사이트 · 앱을 프리셋으로 저장하고 타이머로 집중 세션 진행,
      남은 시간은 잠금 화면과 Dynamic Island에 표시
    - **예약 집중** — 정해둔 요일과 시간에 집중 세션을 자동으로 시작하고 종료
    - **집중 기록** — 집중 세션의 통계와 기록 확인
    - **숨긴 목록** — 차단 항목을 목록에서 숨기고 Face ID 등 기기 인증으로 보호

    ## 기술 노트

    - Apple 스크린 타임 프레임워크(Family Controls · Managed Settings · Device Activity)로 차단하며,
      선택한 앱은 이름 대신 Apple이 주는 불투명한 토큰으로만 다룹니다.
    - 회원가입도 서버도 없이, 모든 데이터는 App Group 공유 저장소에 저장해 앱 · 위젯 · 공유 확장 · 스크린 타임 모니터가 함께 씁니다.

- letter: d
  name: My Day Off
  tagline: 남은 연차와 예정된 휴가를 한 눈에 보는 연차 관리 앱
  platforms: [iOS]
  icon: /assets/icons/mini/d.png
  media: /assets/media/d.mp4
  store_url: https://apps.apple.com/kr/app/my-day-off/id6784244906
  privacy: mydayoff
  description: |
    ## 소개

    My Day Off는 올해 남은 연차와 앞으로 쓸 휴가를 한 곳에서 가볍게 관리하는 iOS 앱입니다.
    앱을 열면 총·사용·예정·잔여 연차가 링 하나로 정리되어 보이고,
    휴가가 끝나면 실제로 썼는지 앱이 먼저 물어봅니다.

    ## 주요 기능

    - 총·사용예정·사용완료·잔여 연차를 링과 숫자로 한눈에 확인
    - 목록과 캘린더 두 가지 보기, 종일 휴가와 반차(시간 단위)를 함께 기록
    - 휴가가 끝나는 시각에 알림을 보내 사용 여부를 알림에서 바로 확인
    - 홈 화면 위젯 두 종류 — 다가오는 휴가 D-day, 연차 현황판
    - 지난 연도 연차 사용 내역을 아카이브로 보관
    - 기기에 구독된 지역 공휴일을 캘린더에 함께 표시
    - 한국어·영어 지원, 앱 안에서 표시 언어 전환

    ## 기술 노트

    - 연차를 '일'이 아닌 '시간'으로 계산합니다. 근무 시작·종료 시각과 점심시간 설정에서
      하루 순 근무 시간을 구하고, 반차는 점심시간과 겹치는 만큼을 빼고 차감합니다.
    - SwiftData로 기기 안에만 저장하고, 위젯에는 App Group 공유 저장소에 요약 스냅샷만 넘깁니다.
      회원가입도 서버도 없습니다.
    - 공휴일은 iOS가 지역에 맞춰 자동 구독해 둔 캘린더를 EventKit으로 **읽기만** 합니다.
      음력 명절과 대체공휴일까지 OS가 관리하는 값을 그대로 씁니다.

- letter: r
  name: My Raum
  tagline: 내 방을 3D로 스캔해 스토리처럼 꾸미고, 가구를 다시 배치해보는 공간 기록 앱
  platforms: [iOS]
  icon: /assets/icons/mini/r.png
  store_url: https://apps.apple.com/kr/app/my-raum/id6504674031
  github_url: https://github.com/DeveloperAcademy-POSTECH/2024-NC2-M15-RoomPlan
  privacy: myraum
  terms: myraum
  description: |
    ## 소개

    My Raum은 iPhone의 LiDAR 센서로 내 방을 스캔해 3D 모형으로 남기는 공간 기록 앱입니다.
    벽과 가구를 천천히 비추기만 하면 하얀 미니어처 같은 3D 공간이 만들어지고,
    원하는 각도로 돌려 인스타그램 스토리처럼 장소·날짜·글을 올려 나만의 공간 카드를 만들 수 있어요.
    스캔한 가구를 옮겨 보거나 새 가구를 들여놓으며 방의 배치를 미리 바꿔볼 수도 있습니다.

    ## 주요 기능

    - **공간 스캔** — RoomPlan이 벽 · 문 · 창문과 소파 · 침대 · 테이블 같은 가구를 실시간으로 인식해 3D 모델로 저장
    - **공간 카드 꾸미기** — 3D 모델의 각도를 맞추고 장소 · 날짜 · 텍스트 · 가구 목록을 드래그와 핀치로 배치,
      배경은 사진이나 그라데이션 중에서 선택. 요소가 가운데 · 여백 기준선에 맞춰지면 햅틱으로 알려줍니다.
    - **가구 배치 편집** — 스캔한 가구를 드래그해 옮기고 두 손가락으로 돌리기, 원래 위치로 되돌리기 · 삭제.
      가구는 벽이나 다른 가구를 통과하지 않고 벽을 따라 미끄러지며, 의자는 테이블 밑으로 넣을 수 있어요.
    - **오브젝트** — 의자 · 소파 · 테이블 · 침대 · 수납 · 주방 · 욕실 등 30여 종의 기본 가구를 3D로 둘러보고 내 공간에 추가
    - **보관함** — 저장한 공간 카드를 모아 보고, 3D로 돌려 보기 · 다시 꾸미기 · 이미지 저장 · 여러 장 한 번에 삭제
    - **지도** — 공간을 스캔한 위치에 카드 썸네일을 띄워 내가 기록한 공간들을 지도에서 한눈에
    - **공유** — 카드를 이미지로, 3D 공간은 USDZ 파일로 공유해 받는 사람도 AR Quick Look으로 바로 확인
    - 한국어 · 영어 지원, 앱 안에서 언어 · 햅틱 · 위치 정보 저장 여부 설정

    ## 지원 환경

    - iOS 17.0 이상, LiDAR 센서가 있는 iPhone (iPhone 12 Pro 이후 Pro 모델)
    - 지원하지 않는 기기에서는 이유와 지원 기기 확인 방법을 안내하는 화면이 표시됩니다.

    ## 기술 노트

    - 스캔 결과는 USDZ 파일과 함께 RoomPlan의 `CapturedRoom` 원본 데이터(JSON)를 SwiftData에 보관합니다.
      가구 배치를 바꾸면 원본은 그대로 두고 변경분(이동 · 추가 · 삭제)만 따로 저장해, 언제든 원래 배치로 되돌릴 수 있어요.
    - 3D 공간은 SceneKit으로 직접 다시 그립니다. 가구는 RoomPlan이 알려주는 종류와 형태 정보
      (의자 다리 · 팔걸이 유무, 소파 · 테이블 모양 등)와 크기로 절차적으로 모델링해, 같은 방법으로 기본 가구 목록도 만듭니다.
    - 가구 충돌은 위에서 내려다본 바닥면 직사각형끼리의 분리축 검사(SAT)로 처리하고,
      스캔 오차로 처음부터 벽에 살짝 묻혀 있던 가구가 튀어나가지 않도록 시작 시점의 겹침을 허용 범위로 둡니다.
    - 카메라 · 위치 데이터는 기기 안에만 저장하며, 회원가입도 서버도 없습니다.

- letter: opt
  name: 집가고싶다
  tagline: 퇴근까지 남은 시간을 캐릭터와 함께 세는 퇴근 타이머 앱
  platforms: [iOS]
  icon: /assets/icons/mini/opt.png
  store_url: https://apps.apple.com/kr/app/%EC%A7%91%EA%B0%80%EA%B3%A0%EC%8B%B6%EB%8B%A4-%ED%87%B4%EA%B7%BC%ED%83%80%EC%9D%B4%EB%A8%B8-%ED%87%B4%EA%B7%BC%EC%95%8C%EB%A6%AC%EB%AF%B8/id6799638830
  privacy: wannagohome
  description: |
    ## 소개

    집가고싶다는 등록해둔 근무지에 도착하면 오늘의 퇴근 시간을 물어보고,
    귀여운 캐릭터와 함께 퇴근까지 남은 시간을 세어주는 iOS 앱입니다.

    ## 주요 기능

    - 지오펜스로 근무지 도착을 감지해 퇴근 시간을 묻는 알림 발송
    - 홈 화면·잠금화면 위젯과 라이브 액티비티로 남은 시간 확인
    - 캐릭터를 골라 이름을 지어주면 앱 아이콘도 함께 바뀜

    ## 기술 노트

    - 캐릭터는 이미지가 아니라 SwiftUI로 그린 벡터 아트로, 앱 아이콘도 같은 아트에서 생성합니다.
    - 회원가입과 서버 없이 App Group 공유 저장소만으로 앱·위젯·라이브 액티비티가 데이터를 주고받습니다.


- letter: ctrl
  name: Neckle
  tagline: AirPods과 함께하는 간단한 목 운동
  platforms: [iOS, iPadOS, macOS]
  icon: /assets/icons/mini/ctrl.png
  media: /assets/media/neckle.mp4
  store_url: https://apps.apple.com/kr/app/neckle/id6742444201
  github_url: https://github.com/PictureHouse/Neckle
  privacy: neckle
  description: |
    ## 소개

    Neckle은 누구나 쉽게 목 운동을 할 수 있도록 도와주는 앱입니다.
    AirPods을 착용하고 음성 안내에 따라 고개를 움직이면, AirPods의 모션 센서가
    머리의 움직임을 인식해 운동을 올바르게 수행했는지 확인해줍니다.

    **🍎 WWDC25 Swift Student Challenge Winner** 수상작으로, 이후 App Store에 정식 출시했습니다.

    ## 주요 기능

    - AirPods의 모션 센서(CoreMotion)로 머리 움직임을 인식하는 인터랙티브 목 운동
    - 음성 안내(AVFoundation)에 따라 화면을 보지 않고도 운동 가능
    - 한 번 착용한 AirPods을 자동으로 기억하는 간편한 연결
    - 한국어·영어·일본어·중국어·독일어·이탈리아어·스페인어·포르투갈어 등 8개 언어 지원

    ## 지원 환경

    - iOS 17.0+ / iPadOS 17.0+ / macOS 14.0+ (Apple Silicon) / visionOS 1.0+
    - 모션 인식이 가능한 AirPods (AirPods Pro, AirPods 3세대 이상 등)

    ## 기술

    SwiftUI · CoreMotion · AVFoundation — Xcode App Playground로 개발했습니다.
