{%- comment -%} 수도 여행 카드 일러스트 — 별이 뜬 우주, 떠오르는 지구본, 수도 사이 대권 항로를 나는 비행기. uid로 id 충돌을 피하고, fit="meet"이면 넓은 배너에서도 전체가 보이도록 배경이 좌우로 이어진다. {%- endcomment -%}
{%- assign u = include.uid | default: "ct" -%}
<svg class="wp-art" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid {{ include.fit | default: 'slice' }}" aria-hidden="true">
  <defs>
    <radialGradient id="{{ u }}-globe" cx="50%" cy="8%" r="75%">
      <stop offset="0" stop-color="#3d7fd0"/>
      <stop offset="0.45" stop-color="#14407a"/>
      <stop offset="1" stop-color="#06122b"/>
    </radialGradient>
    <radialGradient id="{{ u }}-atmo" cx="50%" cy="50%" r="50%">
      <stop offset="0.86" stop-color="#6fb2ff" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#6fb2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6fb2ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="{{ u }}-clip"><circle cx="200" cy="350" r="240"/></clipPath>
    <path id="{{ u }}-route" d="M92,168 Q200,38 308,150"/>
  </defs>
  <rect x="-600" width="1600" height="240" fill="#050a18"/>
  <g fill="#fff">
    <circle cx="24" cy="30" r="1" opacity="0.7"/><circle cx="62" cy="74" r="0.8" opacity="0.5"/>
    <circle cx="110" cy="18" r="1.2" opacity="0.8"/><circle cx="150" cy="60" r="0.7" opacity="0.4"/>
    <circle cx="238" cy="22" r="0.9" opacity="0.6"/><circle cx="286" cy="52" r="1.1" opacity="0.7"/>
    <circle cx="336" cy="16" r="0.8" opacity="0.5"/><circle cx="372" cy="64" r="1.2" opacity="0.8"/>
    <circle cx="16" cy="110" r="0.8" opacity="0.4"/><circle cx="388" cy="118" r="0.9" opacity="0.5"/>
    <circle cx="196" cy="8" r="0.7" opacity="0.5"/><circle cx="352" cy="96" r="0.6" opacity="0.4"/>
    <circle cx="-40" cy="40" r="1" opacity="0.6"/><circle cx="-96" cy="120" r="0.8" opacity="0.5"/>
    <circle cx="-150" cy="70" r="1.1" opacity="0.7"/><circle cx="-60" cy="190" r="0.7" opacity="0.4"/>
    <circle cx="436" cy="34" r="1" opacity="0.6"/><circle cx="492" cy="140" r="0.8" opacity="0.5"/>
    <circle cx="548" cy="80" r="1.1" opacity="0.7"/><circle cx="460" cy="200" r="0.7" opacity="0.4"/>
  </g>
  <circle cx="200" cy="350" r="262" fill="url(#{{ u }}-atmo)"/>
  <circle cx="200" cy="350" r="240" fill="url(#{{ u }}-globe)"/>
  <g clip-path="url(#{{ u }}-clip)" fill="none" stroke="rgba(170,210,255,0.13)" stroke-width="1">
    <ellipse cx="200" cy="350" rx="240" ry="150"/>
    <ellipse cx="200" cy="350" rx="240" ry="210"/>
    <ellipse cx="200" cy="350" rx="60" ry="240"/>
    <ellipse cx="200" cy="350" rx="130" ry="240"/>
    <ellipse cx="200" cy="350" rx="195" ry="240"/>
    <line x1="200" y1="100" x2="200" y2="240"/>
  </g>
  <use href="#{{ u }}-route" fill="none" stroke="#ffd60a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 6"/>
  <g fill="#ffd60a">
    <circle cx="92" cy="168" r="3.5"/>
    <circle cx="308" cy="150" r="3.5"/>
    <circle class="wp-art__pulse" cx="308" cy="150" r="3.5" fill="none" stroke="#ffd60a" stroke-width="1">
      <animate attributeName="r" values="3.5;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="1.6" fill="rgba(255,255,255,0.75)">
    <text x="92" y="186" text-anchor="middle">PARIS</text>
    <text x="308" y="168" text-anchor="middle">SEOUL</text>
  </g>
  <g class="wp-art__mover">
    <path transform="rotate(90) translate(-11.5 -12)" fill="#ffd60a" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#{{ u }}-route"/></animateMotion>
  </g>
</svg>
