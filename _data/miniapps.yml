# 미니앱 목록
# 새 미니앱이 생기면 아래 형식으로 항목을 추가하고,
# 아이콘 이미지를 assets/icons/mini/ 에 업로드하세요.
# 목록에 없는 알파벳은 키보드에서 회색 비활성 키로 표시됩니다.
#
# - letter: a                              # 알파벳 (소문자, 필수)
#   name: Aurora                           # 앱 이름 (필수)
#   tagline: 한 줄 소개                     # 팝업·툴팁에 표시 (선택)
#   icon: /assets/icons/mini/a.png         # 아이콘 경로 (필수)
#   store_url: https://apps.apple.com/...  # App Store 버튼 (선택)
#   github_url: https://github.com/...     # GitHub 버튼 (선택)
#   privacy: aurora                        # _privacy/aurora.md 연결 (선택)
#   screenshots:                           # 팝업 스크린샷 (선택)
#     - /assets/icons/mini/a-shot-1.png
#   description: |                         # 팝업 본문, 마크다운 (선택)
#     ## 소개
#     ...

- letter: r
  name: My Raum
  tagline: RoomPlan으로 공간을 기록하고 공유하는 앱
  icon: /assets/icons/mini/r.png
  store_url: https://apps.apple.com/kr/app/my-raum/id6504674031
  github_url: https://github.com/DeveloperAcademy-POSTECH/2024-NC2-M15-RoomPlan
  description: |
    ## 소개

    My Raum은 Apple의 RoomPlan과 Maps를 활용해 공간을 3D로 스캔하고,
    위치 정보와 함께 생생하게 기록·공유할 수 있는 iOS 앱입니다.

    ## 주요 기능

    - 카메라와 LiDAR 센서로 공간을 스캔해 3D 평면 모델로 캡쳐 (RoomPlan)
    - 캡쳐한 공간 모델을 이미지로 변환해 사진·텍스트와 함께 나만의 공간 기록 작성
    - Maps 연동으로 공간의 위치를 함께 저장하고 공유

    ## 기술 노트

    - RoomPlan의 스캔 제약(최대 5분, 9m×9m, 직육면체 인식)을 고려해
      캡쳐된 모델을 이미지 기반 기록으로 활용하는 방식을 채택했습니다.

- letter: opt
  name: 집가고싶다
  tagline: 퇴근까지 남은 시간을 캐릭터와 함께 세는 퇴근 타이머 앱
  icon: /assets/icons/mini/opt.png
  privacy: wannagohome
  description: |
    ## 소개

    집가고싶다는 지도에서 근무지를 등록해두면 출근했을 때 오늘의 퇴근 시간을 물어보고,
    귀여운 캐릭터와 함께 퇴근까지 남은 시간을 세어주는 iOS 앱입니다.
    회원가입도, 서버도 없이 기기 안에서만 동작합니다.

    ## 주요 기능

    - 근무지 등록(GPS 지오펜스) — 등록한 근무지에 도착하면 "오늘은 몇 시에 퇴근할 거야?"라고
      묻는 알림이 오고, 알림에서 바로 17·18·19시를 고르거나 직접 설정
    - 원형 타이머 위젯 — 홈 화면(작은·중간)과 잠금화면(원형)에서 진행률 링과 카운트다운으로
      남은 시간 표시. 위젯 버튼으로 퇴근 시간을 바로 설정
    - 라이브 액티비티 — 퇴근 1시간 전부터 잠금화면과 다이나믹 아일랜드에 타이머 표시
    - 알림 — 퇴근 1시간 전과 퇴근 시각에 캐릭터가 알림을 보냄
    - 캐릭터 — 강아지(몽이)·고양이(치즈)·햄스터(햄찌) 중에서 고르고 이름은 직접 지어주기.
      고른 캐릭터의 얼굴로 앱 아이콘까지 바뀜

    ## 기술 노트

    - 캐릭터는 이미지가 아니라 SwiftUI로 그린 벡터 아트입니다. 공용 모션 드라이버가
      기분(calm/happy/party)에 맞춰 둥실거림·꼬리 흔들림·눈 깜빡임 타이밍을 처리합니다.
    - 앱 아이콘 전환은 대체 앱 아이콘(Alternate App Icon)으로 구현했고,
      아이콘 PNG는 캐릭터 아트를 그대로 렌더링하는 스크립트로 생성해 에셋과 어긋나지 않게 했습니다.
    - iOS는 라이브 액티비티를 앱이 포그라운드일 때만 시작할 수 있어,
      앱 활성화 시점·알림 탭·App Intents(LiveActivityIntent) 세 경로로 나눠 시작합니다.
    - 메인 앱과 위젯 익스텐션은 App Group 공유 저장소로 데이터를 주고받습니다.
      위젯은 앱 번들 리소스를 직접 읽을 수 없어 캐릭터 에셋도 App Group 컨테이너로 복사해 사용합니다.
    - 지오펜스 판정은 iOS가 기기 안에서 처리하므로, 백그라운드에서도 배터리 소모 없이
      도착을 감지하면서 이동 경로는 전혀 수집하지 않습니다.

