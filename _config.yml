title: Picture House
description: Apps by Picture House — mini apps and more.
url: "https://picturehouse.github.io"
baseurl: ""
lang: ko

# 서비스(미니앱이 아닌 앱), 개인정보처리방침, 이용약관은 컬렉션으로 관리합니다.
# _services/앱이름.md → /services/앱이름/
# _privacy/앱이름.md → /privacy/앱이름/
# _terms/앱이름.md → /terms/앱이름/
collections:
  services:
    output: true
    permalink: /services/:name/
  privacy:
    output: true
    permalink: /privacy/:name/
  terms:
    output: true
    permalink: /terms/:name/

defaults:
  - scope:
      path: ""
      type: services
    values:
      layout: service
  - scope:
      path: ""
      type: privacy
    values:
      layout: legal
  - scope:
      path: ""
      type: terms
    values:
      layout: legal
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
