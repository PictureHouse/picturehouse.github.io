- id: f1-circuit
  name: F1 Circuit
  tagline: 카메라 앞에서 맨손으로 핸들을 잡듯 운전하는 3D F1 레이싱
  kicker: Racing Game · Three.js
  icon: /assets/icons/web/f1-circuit.png
  url: https://f1-circuit.vercel.app/
  platforms: [Web]
  theme:
    bg: "#14161c"
    accent: "#ff2a20"
    on_accent: "#ffffff"
  chips: [Hand Tracking, 4 Circuits, P2P Race]
  description: |
    ## 소개

    F1 Circuit은 앱 설치 없이 브라우저에서 바로 즐기는 3D F1 레이싱 게임입니다.
    핸드폰이나 노트북을 책상에 세워 두고 화면 앞에서 핸들을 잡듯 양손을 들면,
    전면 카메라가 손을 인식해 그대로 차를 몹니다.
    혼자서는 프렉티스 모드로 트랙별 랩 타임을 다듬고,
    친구들과는 그 기록 순으로 그리드에 서서 레이스 모드로 대결해 보세요.

    ## 조작 방법

    - **조향** — 양손을 나란히 들고 두 손을 잇는 선을 기울이기. 크게 돌려 양손이 엇갈려도 조향이 이어집니다.
    - **가속** — 양손 주먹 (한 손만 쥐면 절반), 손을 펴면 가속 해제
    - **브레이크** — 편 손바닥을 카메라 쪽으로 밀기
    - 시작할 때 양손을 잠깐 가만히 들고 있으면 그 자세를 직진 기준으로 잡고, 조향 감도도 고를 수 있어요.
    - 드라이버 시점의 장갑이 내 손 모양(주먹 · 편 손)을 따라 움직입니다.

    ## 게임 모드

    - **프렉티스 모드** — 랩 수 제한 없이 달리며 트랙별 베스트 랩에 도전. 랩마다 베스트 대비 차이를 보여 주고, 세션 랩 타임 목록도 확인할 수 있습니다.
    - **레이스 모드** — 4자리 방 코드로 모이는 P2P 3랩 레이스. 프렉티스 베스트 랩 순으로 스타팅 그리드가 정해지고, 실시간 순위 · 차량 간 충돌 · 참가자 전원이 보이는 미니맵을 지원합니다. 누가 일시정지하면 모두 함께 멈춰요 (최대 60초).

    ## 주요 기능

    - 그랑프리 · 스피드웨이 · 테크니컬 · 시가지, 성격이 다른 4가지 서킷
    - 미니어처 서킷 같은 디오라마 그래픽 위에 실사 재질의 차 · 타이어 · 노면, 늦은 오후 햇빛과 렌즈 플레어
    - 스티어링 휠을 잡은 팔과 장갑, 기어 · 속도 · 회전수 디스플레이와 시프트 라이트까지 보이는 드라이버 시점
    - 크루 7명이 오가는 피트 개러지 메인 화면, 12가지 팀 컬러 리버리
    - 기어 변속 · 터보 · 배기 팝까지 합성한 V6 하이브리드 엔진 사운드
    - 가로 · 세로 화면 모두 지원, 한국어 · 영어 지원 (기기 언어에 맞춰 자동 선택)

    ## 기술 노트

    - Three.js + Vite로 만든 정적 웹앱으로, iPhone Safari · Android Chrome · PC 웹캠에서 동작합니다.
    - 손 인식은 MediaPipe Hand Landmarker(양손 21개 관절)를 GPU로 돌리며, 카메라를 켤 때만 불러옵니다.
      카메라 영상은 기기 안에서만 처리하고 저장 · 전송하지 않습니다.
    - 조향은 기준 자세 대비 상대각을 이어 붙여(unwrap) 계산해, 어느 손이 왼손으로 잡히든 · 양손이 엇갈려도 끊기지 않고, 1€ 필터로 떨림을 거릅니다.
    - 서킷의 노면 · 연석 · 방호벽 · 관중석 · 건물은 스플라인 제어점에서 절차적으로 생성하고,
      카본 직조 · 타이어 · 장갑 직물 등 모든 텍스처도 이미지 파일 없이 캔버스로 그립니다.
    - 멀티플레이는 PeerJS(WebRTC)로 기기끼리 직접 연결해 게임 서버가 없습니다.
    - 엔진음은 음원 파일 없이 WebAudio로 배기 펄스를 합성해 만듭니다.

- id: capital-travel
  name: 수도 여행
  tagline: 3D 지구본 위를 비행기로 날며 세계의 수도를 익히는 게임
  kicker: Geography Game · globe.gl
  icon: /assets/icons/web/capital-travel.png
  url: https://capital-travel-web.vercel.app/
  platforms: [Web, Toss]
  # toss_url: intoss://capital-travel        # 토스 미니앱 출시 후 주석 해제
  terms: capital-travel
  theme:
    bg: "#050a18"
    accent: "#ffd60a"
    on_accent: "#1a1400"
  chips: [3D Globe, 196 Capitals, Travel & Quiz]
  description: |
    ## 소개

    수도 여행은 3D 지구본 위를 비행기로 날아다니며 세계 196개국의 수도를 익히는 웹 게임입니다.
    지금 나라가 지구본 위에 강조되고, 수도를 맞히면 비행기가 이륙해
    다음 수도까지 대권 항로를 따라 날아가며 지구본도 함께 돌아갑니다.

    ## 모드

    - **여행 모드** — 화면에 나온 수도 이름을 따라 입력하면 다음 도시로 비행합니다.
      경로는 무작위 또는 가까운 순서로 고를 수 있고, 여행이 끝나면 총 비행 거리와 경로를 보여줍니다.
    - **퀴즈 모드** — 나라를 보고 수도를 맞힙니다. 힌트와 건너뛰기, 점수와 연속 정답 기록이 있어요.

    ## 주요 기능

    - 전 세계 또는 아시아·유럽·아프리카·북중미·남미·오세아니아 지역별 선택, 문제 수 선택
    - 한국어·영어 정답 모두 인정, 다른 표기와 작은 오타도 허용
    - 접속 지역에 따라 한국어/영어 자동 선택, 언제든 전환 가능

    ## 기술 노트

    - globe.gl(three.js) 지구본 위에 국가 경계를 올리고, 대권 항로 비행과 카메라 추적을 구현했습니다.
    - 비행기는 three.js로 직접 만든 로우폴리 모델입니다.
    - Vite로 빌드한 정적 사이트입니다.
