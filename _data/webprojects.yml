- id: f1-circuit
  name: F1 Circuit
  tagline: 핸드폰을 핸들처럼 돌리거나 맨손으로 운전하는 모바일 3D F1 레이싱
  kicker: Racing Game · Three.js
  icon: /assets/icons/web/f1-circuit.png
  url: https://f1-circuit.vercel.app/
  platforms: [Web]
  theme:
    bg: "#14161c"
    accent: "#ff2a20"
    on_accent: "#ffffff"
  chips: [4 Circuits, Motion & Hand Control, P2P Multiplayer]
  description: |
    ## 소개

    F1 Circuit은 앱 설치 없이 브라우저에서 바로 즐기는 모바일 3D F1 레이싱 게임입니다.
    핸드폰을 가로로 눕혀 스티어링 휠처럼 돌리면 차가 방향을 틀고,
    화면을 살짝 젖히거나 숙여 가속과 브레이크를 조작합니다.
    새로 추가된 드라이버 모드에서는 카메라 앞에서 맨손으로 핸들을 잡듯 운전할 수 있어요.
    피트 개러지에서 출발해 혼자 베스트 랩에 도전하거나, 방 코드로 친구들을 모아 레이스를 펼쳐 보세요.

    ## 조작 방식

    - **기기 동작** — 핸드폰을 돌려 조향, 뒤로 젖히면 가속·앞으로 숙이면 브레이크
    - **기기 동작 + 버튼** — 가속·브레이크는 기울기로, 조향은 화면 양옆 ◀ ▶ 버튼으로
    - **키보드** — PC에서는 방향키·WASD로 바로 출발
    - **드라이버 모드 (BETA)** — 전면 카메라가 양손을 인식해, 두 손을 기울여 조향하고 주먹을 쥐면 가속,
      손바닥을 밀면 브레이크. 드라이버 시점의 장갑도 내 손 모양을 따라 움직입니다.

    ## 주요 기능

    - 그랑프리 · 스피드웨이 · 테크니컬 · 시가지, 성격이 다른 4가지 서킷 (트랙별 베스트 랩 저장)
    - 방 코드로 모이는 친구와의 P2P 3랩 레이스 — 무작위 출발 그리드, 실시간 순위, 차량 간 충돌
    - 크루가 오가는 피트 개러지 메인 화면, 12가지 팀 컬러 리버리
    - 체이스 뷰 ↔ 스티어링 휠을 잡은 팔까지 보이는 드라이버 뷰
    - 기어 변속·터보·배기 팝까지 합성한 V6 하이브리드 엔진 사운드
    - 한국어·영어 지원 (기기 언어에 맞춰 자동 선택)

    ## 기술 노트

    - Three.js + Vite로 만든 정적 웹앱으로, iPhone Safari와 Android Chrome에서 똑같이 동작합니다.
    - 서킷의 노면·연석·방호벽·관중석·건물은 스플라인 제어점에서 절차적으로 생성하고,
      기울기 조작에 맞춰 모든 코너의 반경을 약 33m 이상으로 다듬었습니다.
    - 드라이버 모드는 MediaPipe Hand Landmarker로 손을 인식하며, 이 모드를 고를 때만 불러옵니다.
      카메라 영상은 기기 안에서만 처리하고 저장·전송하지 않습니다.
    - 멀티플레이는 PeerJS(WebRTC)로 기기끼리 직접 연결해 게임 서버가 없습니다.
    - 엔진음은 음원 파일 없이 WebAudio로 배기 펄스를 합성해 만듭니다.
    - OS 화면 회전 잠금과 상관없이 항상 가로로 보이도록, 세로로 들면 게임 화면을 직접 90° 회전시켜 렌더링합니다.

- id: capital-travel
  name: 수도 여행
  tagline: 3D 지구본 위를 비행기로 날며 세계의 수도를 익히는 게임
  kicker: Geography Game · globe.gl
  icon: /assets/icons/web/capital-travel.png
  url: https://capital-travel-web.vercel.app/
  platforms: [Web]
  theme:
    bg: "#050a18"
    accent: "#ffd60a"
    on_accent: "#1a1400"
  chips: [3D Globe, 196 Capitals, Travel & Quiz]
  description: |
    ## 소개

    수도 여행은 3D 지구본 위를 비행기로 날아다니며 세계 196개국의 수도를 익히는 웹 게임입니다.
    지금 나라가 지구본 위에 강조되고, 수도를 맞히면 비행기가 이륙해
    다음 수도까지 대권 항로를 따라 날아가며 지구본도 함께 돌아갑니다.

    ## 모드

    - **여행 모드** — 화면에 나온 수도 이름을 따라 입력하면 다음 도시로 비행합니다.
      경로는 무작위 또는 가까운 순서로 고를 수 있고, 여행이 끝나면 총 비행 거리와 경로를 보여줍니다.
    - **퀴즈 모드** — 나라를 보고 수도를 맞힙니다. 힌트와 건너뛰기, 점수와 연속 정답 기록이 있어요.

    ## 주요 기능

    - 전 세계 또는 아시아·유럽·아프리카·북중미·남미·오세아니아 지역별 선택, 문제 수 선택
    - 한국어·영어 정답 모두 인정, 다른 표기와 작은 오타도 허용
    - 접속 지역에 따라 한국어/영어 자동 선택, 언제든 전환 가능

    ## 기술 노트

    - globe.gl(three.js) 지구본 위에 국가 경계를 올리고, 대권 항로 비행과 카메라 추적을 구현했습니다.
    - 비행기는 three.js로 직접 만든 로우폴리 모델입니다.
    - Vite로 빌드한 정적 사이트입니다.
