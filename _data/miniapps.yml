# 미니앱 목록
# 새 미니앱이 생기면 아래 형식으로 항목을 추가하고,
# 아이콘 이미지를 assets/icons/mini/ 에 업로드하세요.
# 목록에 없는 알파벳은 키보드에서 회색 비활성 키로 표시됩니다.
#
# - letter: a                              # 알파벳 (소문자, 필수)
#   name: Aurora                           # 앱 이름 (필수)
#   tagline: 한 줄 소개                     # 팝업·툴팁에 표시 (선택)
#   icon: /assets/icons/mini/a.png         # 아이콘 경로 (필수)
#   store_url: https://apps.apple.com/...  # App Store 버튼 (선택)
#   github_url: https://github.com/...     # GitHub 버튼 (선택)
#   privacy: aurora                        # 개인정보처리방침 앱 키 (선택)
#                                          # _privacy/aurora.md(한국어) · aurora-en.md(영어, 선택)
#   screenshots:                           # 팝업 스크린샷 (선택)
#     - /assets/icons/mini/a-shot-1.png
#   description: |                         # 팝업 본문, 마크다운 (선택)
#     ## 소개
#     ...

- letter: d
  name: My Day Off
  tagline: 남은 연차와 예정된 휴가를 한 눈에 보는 연차 관리 앱
  icon: /assets/icons/mini/d.png
  privacy: mydayoff
  description: |
    ## 소개

    My Day Off는 올해 남은 연차와 앞으로 쓸 휴가를 한 곳에서 가볍게 관리하는 iOS 앱입니다.
    앱을 열면 총·사용·예정·잔여 연차가 링 하나로 정리되어 보이고,
    휴가가 끝나면 실제로 썼는지 앱이 먼저 물어봅니다.

    ## 주요 기능

    - 총·사용예정·사용완료·잔여 연차를 링과 숫자로 한눈에 확인
    - 목록과 캘린더 두 가지 보기, 종일 휴가와 반차(시간 단위)를 함께 기록
    - 휴가가 끝나는 시각에 알림을 보내 사용 여부를 알림에서 바로 확인
    - 홈 화면 위젯 두 종류 — 다가오는 휴가 D-day, 연차 현황판
    - 지난 연도 연차 사용 내역을 아카이브로 보관
    - 기기에 구독된 지역 공휴일을 캘린더에 함께 표시
    - 한국어·영어 지원, 앱 안에서 표시 언어 전환

    ## 기술 노트

    - 연차를 '일'이 아닌 '시간'으로 계산합니다. 근무 시작·종료 시각과 점심시간 설정에서
      하루 순 근무 시간을 구하고, 반차는 점심시간과 겹치는 만큼을 빼고 차감합니다.
    - SwiftData로 기기 안에만 저장하고, 위젯에는 App Group 공유 저장소에 요약 스냅샷만 넘깁니다.
      회원가입도 서버도 없습니다.
    - 공휴일은 iOS가 지역에 맞춰 자동 구독해 둔 캘린더를 EventKit으로 **읽기만** 합니다.
      음력 명절과 대체공휴일까지 OS가 관리하는 값을 그대로 씁니다.

- letter: r
  name: My Raum
  tagline: RoomPlan으로 공간을 기록하고 공유하는 앱
  icon: /assets/icons/mini/r.png
  store_url: https://apps.apple.com/kr/app/my-raum/id6504674031
  github_url: https://github.com/DeveloperAcademy-POSTECH/2024-NC2-M15-RoomPlan
  description: |
    ## 소개

    My Raum은 Apple의 RoomPlan과 Maps를 활용해 공간을 3D로 스캔하고,
    위치 정보와 함께 생생하게 기록·공유할 수 있는 iOS 앱입니다.

    ## 주요 기능

    - 카메라와 LiDAR 센서로 공간을 스캔해 3D 평면 모델로 캡쳐 (RoomPlan)
    - 캡쳐한 공간 모델을 이미지로 변환해 사진·텍스트와 함께 나만의 공간 기록 작성
    - Maps 연동으로 공간의 위치를 함께 저장하고 공유

    ## 기술 노트

    - RoomPlan의 스캔 제약(최대 5분, 9m×9m, 직육면체 인식)을 고려해
      캡쳐된 모델을 이미지 기반 기록으로 활용하는 방식을 채택했습니다.

- letter: opt
  name: 집가고싶다
  tagline: 퇴근까지 남은 시간을 캐릭터와 함께 세는 퇴근 타이머 앱
  icon: /assets/icons/mini/opt.png
  store_url: https://apps.apple.com/kr/app/%EC%A7%91%EA%B0%80%EA%B3%A0%EC%8B%B6%EB%8B%A4-%ED%87%B4%EA%B7%BC%ED%83%80%EC%9D%B4%EB%A8%B8-%ED%87%B4%EA%B7%BC%EC%95%8C%EB%A6%AC%EB%AF%B8/id6799638830
  privacy: wannagohome
  description: |
    ## 소개

    집가고싶다는 등록해둔 근무지에 도착하면 오늘의 퇴근 시간을 물어보고,
    귀여운 캐릭터와 함께 퇴근까지 남은 시간을 세어주는 iOS 앱입니다.

    ## 주요 기능

    - 지오펜스로 근무지 도착을 감지해 퇴근 시간을 묻는 알림 발송
    - 홈 화면·잠금화면 위젯과 라이브 액티비티로 남은 시간 확인
    - 캐릭터를 골라 이름을 지어주면 앱 아이콘도 함께 바뀜

    ## 기술 노트

    - 캐릭터는 이미지가 아니라 SwiftUI로 그린 벡터 아트로, 앱 아이콘도 같은 아트에서 생성합니다.
    - 회원가입과 서버 없이 App Group 공유 저장소만으로 앱·위젯·라이브 액티비티가 데이터를 주고받습니다.

