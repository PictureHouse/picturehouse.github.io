# 미니앱 목록
# 새 미니앱이 생기면 아래 형식으로 항목을 추가하고,
# 아이콘 이미지를 assets/icons/mini/ 에 업로드하세요.
# 목록에 없는 알파벳은 키보드에서 회색 비활성 키로 표시됩니다.
#
# - letter: a                              # 알파벳 (소문자, 필수)
#   name: Aurora                           # 앱 이름 (필수)
#   tagline: 한 줄 소개                     # 툴팁에 표시 (선택)
#   icon: /assets/icons/mini/a.png         # 아이콘 경로 (필수)
#   store_url: https://apps.apple.com/...  # 클릭 시 이동할 링크 (선택)
#   privacy: aurora                        # _privacy/aurora.md 연결 (선택)

- letter: a
  name: Sample A
  tagline: 샘플 미니앱입니다
  icon: /assets/icons/mini/a.svg
  store_url: "#"
